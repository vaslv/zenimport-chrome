<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenImport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body><main>
  <header><h1>ZenImport</h1><span id="bank"></span></header>
  <form id="current-connection" hidden>
    <strong id="connection-name"></strong>
    <input id="profile-name" aria-label="Connection name" maxlength="120" autocomplete="off" required hidden>
    <button id="rename-profile" class="icon-button" type="button" aria-label="Rename connection" title="Rename connection"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" id="profile-icon" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/></svg></button>
  </form>
  <button id="sync" class="primary" type="button" disabled>Synchronize</button>
  <details id="history-settings" class="settings-section" hidden>
    <summary>Synchronization period</summary>
    <label>Import from<input id="reimport" type="date" required aria-describedby="reimport-hint"></label>
    <div id="history-shortcuts" class="shortcuts"></div>
    <p id="reimport-hint" class="muted">Until today. Applies to the next synchronization.</p>
  </details>
  <p id="last-sync" class="muted" hidden></p>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="stop-paused" type="button" hidden>Stop paused capture</button>
  <button id="discrepancies" type="button" disabled>Discrepancies</button>
    <details id="account-settings" class="settings-section" hidden>
      <summary>Bank accounts</summary>
      <section id="accounts" aria-label="Account mapping"></section>
      <button id="refresh-accounts" type="button">Refresh account list</button>
    </details>
    <details id="connection-settings" class="settings-section"><summary>Server connection</summary>
    <form id="server-form">
      <label>Server address<input id="url" type="url" placeholder="http://localhost:18792" spellcheck="false" required></label>
      <label>Server token<input id="token" maxlength="4096" type="password" autocomplete="off" spellcheck="false" required></label>
      <button id="connect" type="submit">Connect</button>
    </form>
    </details>
    <details id="migration-settings" class="settings-section"><summary>Data migration</summary>
      <p class="muted">Export pauses this server. Connect to the new server, then import before its first synchronization. The ZIP contains private financial data, not server tokens.</p>
      <div class="shortcuts"><button id="export-data" type="button">Export data</button><button id="import-data" type="button" disabled>Import data</button></div>
      <input id="migration-file" type="file" accept=".zip,application/zip" hidden>
      <p id="migration-status" class="migration-status" role="status" aria-live="polite"></p>
      <button id="migration-resume" type="button" hidden>Resume this server</button>
    </details>

</main><script type="module" src="popup.js"></script></body>
</html>
