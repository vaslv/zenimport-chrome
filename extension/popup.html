<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZenImport</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><h1>ZenImport</h1><span id="bank"></span></header>
  <button id="sync" type="button" disabled>Синхронизировать</button>
  <p id="status" role="status" aria-live="polite"></p>
  <details id="settings"><summary>Настройки</summary>
    <form id="server-form"><label>Адрес сервера<input id="url" type="url" placeholder="http://localhost:8000" required></label>
    <label>Токен backend<input id="token" type="password" autocomplete="off" required></label>
    <button type="submit">Подключить</button></form>
    <section id="accounts"></section>
  </details>
</main><script type="module" src="popup.js"></script></body></html>
