<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discrepancies · ZenImport</title><link rel="stylesheet" href="discrepancies.css"></head>
<body><main>
<header><span>ZenImport</span><h1>Discrepancies <span id="bank"></span></h1>
<p>Unmatched bank and ZenMoney transactions on days with complete bank history. Comparison uses account, date and signed amount, including transfer legs. Correct transactions in the ZenMoney app, then refresh. Delivery status does not block this report.</p></header>
<form id="filters"><label>Account<select id="account"><option value="">All bank accounts</option></select></label>
<label>From<input id="from" type="date" required></label><label>To<input id="to" type="date" required></label>
<button id="refresh" type="submit">Refresh</button></form>
<p id="status" role="status" aria-live="polite">Loading data…</p>
<p id="freshness"></p><div id="coverage"></div>
<h2 id="summary"></h2><div id="days" aria-busy="true"></div>
</main><script type="module" src="discrepancies.js"></script></body></html>
