<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Расхождения · ZenImport</title><link rel="stylesheet" href="discrepancies.css"></head>
<body><main>
<header><span>ZenImport</span><h1>Расхождения <span id="bank"></span></h1>

<label>С<input id="from" type="date" required></label><label>По<input id="to" type="date" required></label>

<p id="status" role="status" aria-live="polite">Получаем данные…</p>
<p id="freshness"></p><div id="coverage"></div>
