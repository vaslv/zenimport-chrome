name: Chrome checks and artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unit and browser checks with synthetic services
        run: ./scripts/test-docker.sh
      - name: Reproducible extension archive
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenimport-chrome
          path: dist/zenimport-chrome-*.zip
          if-no-files-found: error
          retention-days: 14
