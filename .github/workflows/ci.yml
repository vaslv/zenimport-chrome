name: Chrome checks and artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unit and browser checks with synthetic services
        run: ./scripts/test-docker.sh
      - name: Offline local storage and SDK probes in current and minimum Chrome
        run: sh scripts/test-local-runtime.sh
      - name: Reproducible extension archive
        run: |
          sh scripts/build-docker.sh
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-build-sha256"
          sh scripts/build-docker.sh
          cmp "$RUNNER_TEMP/first-build-sha256" dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenimport-chrome
          path: |
            dist/zenimport-chrome-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
