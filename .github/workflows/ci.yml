name: Chrome checks and artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit and browser checks with synthetic services
        run: ./scripts/test-docker.sh
      - name: Reproducible extension archive
        run: |
          sh scripts/build-docker.sh
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-build-sha256"
          sh scripts/build-docker.sh
          cmp "$RUNNER_TEMP/first-build-sha256" dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenimport-chrome
          path: |
            dist/zenimport-chrome-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  local-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [local-runtime-tests, local-chrome140]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline native storage and SDK acceptance
        run: sh scripts/test-local-runtime.sh '${{ matrix.target }}'
